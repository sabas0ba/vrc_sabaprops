name: Build Release

# Tag formats:
#   v0.1.0                            -> the only package under Packages/
#   com.sabaprops.foliage/v0.1.0      -> that specific package
on:
  push:
    tags:
      - "v*"
      - "*/v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package id (e.g. com.sabaprops.foliage). Leave empty to auto-detect."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.resolve.outputs.package }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve package and version
        id: resolve
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
        run: |
          set -euo pipefail

          package=""
          version=""

          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            case "$tag" in
              */*)
                package="${tag%/*}"
                version="${tag##*/}"
                ;;
              *)
                version="$tag"
                ;;
            esac
            version="${version#v}"
          fi

          if [ -n "$INPUT_PACKAGE" ]; then
            package="$INPUT_PACKAGE"
          fi

          if [ -z "$package" ]; then
            # No package in the tag: only unambiguous when a single one exists.
            mapfile -t candidates < <(find Packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
            if [ "${#candidates[@]}" -ne 1 ]; then
              echo "::error::Cannot infer the package from tag '$REF_NAME'. Found ${#candidates[@]} packages; tag as '<package-id>/v<version>' instead."
              exit 1
            fi
            package="${candidates[0]}"
          fi

          manifest="Packages/$package/package.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::$manifest not found."
            exit 1
          fi

          manifest_version="$(jq -r '.version' "$manifest")"

          if [ -z "$version" ]; then
            version="$manifest_version"
          fi

          if [ "$manifest_version" != "$version" ]; then
            echo "::error::Tag version ($version) does not match $manifest (.version = $manifest_version). Bump the manifest first."
            exit 1
          fi

          {
            echo "package=$package"
            echo "version=$version"
            echo "manifest=$manifest"
            echo "zip_name=$package-$version.zip"
            echo "json_name=$package-$version.json"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $package $version"

      - name: Determine tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PACKAGE: ${{ steps.resolve.outputs.package }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            # Manual runs create the tag from the manifest version.
            echo "name=$PACKAGE/v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Package zip
        env:
          PACKAGE: ${{ steps.resolve.outputs.package }}
          ZIP_NAME: ${{ steps.resolve.outputs.zip_name }}
        run: |
          set -euo pipefail
          mkdir -p build
          # package.json must sit at the root of the archive for VCC.
          ( cd "Packages/$PACKAGE" && zip -q -r "$GITHUB_WORKSPACE/build/$ZIP_NAME" . -x '.git/*' '.gitignore' )
          unzip -l "build/$ZIP_NAME" | head -n 40

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          PACKAGE: ${{ steps.resolve.outputs.package }}
          VERSION: ${{ steps.resolve.outputs.version }}
          ZIP_NAME: ${{ steps.resolve.outputs.zip_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build/$ZIP_NAME" --clobber
          else
            gh release create "$TAG" "build/$ZIP_NAME" \
              --title "$PACKAGE $VERSION" \
              --notes "VCC からインストールできます: https://sabas0ba.github.io/vrc_sabaprops/index.json" \
              --latest
          fi

      - name: Attach VPM manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          MANIFEST: ${{ steps.resolve.outputs.manifest }}
          ZIP_NAME: ${{ steps.resolve.outputs.zip_name }}
          JSON_NAME: ${{ steps.resolve.outputs.json_name }}
        run: |
          set -euo pipefail

          # Read the download URL back from the release rather than composing
          # it, so tags containing slashes stay correct.
          url="$(gh release view "$TAG" --json assets \
                 --jq ".assets[] | select(.name == \"$ZIP_NAME\") | .url")"

          if [ -z "$url" ]; then
            echo "::error::Could not find $ZIP_NAME on release $TAG."
            exit 1
          fi

          sha="$(sha256sum "build/$ZIP_NAME" | cut -d' ' -f1)"

          jq --arg url "$url" --arg sha "$sha" '. + {url: $url, zipSHA256: $sha}' \
            "$MANIFEST" > "build/$JSON_NAME"

          cat "build/$JSON_NAME"
          gh release upload "$TAG" "build/$JSON_NAME" --clobber

  listing:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-listing.yml
