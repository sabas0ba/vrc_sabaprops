name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Install glslang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools

      # The reference assemblies never change for a given pin, so a cache hit
      # makes the whole job network-independent.
      - name: Cache reference assemblies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .verify/refs
          key: unity-refs-2021.3.33-netfx-1.0.3

      - name: Verify package
        run: ./.github/verify/verify.sh

      # A figure mismatch deliberately fails verify.sh after rendering the
      # expected SVG files. Preserve those files so a contributor without the
      # local .NET/container environment can review and commit the result.
      - name: Upload regenerated figures on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-figures
          path: .verify/figures/svg
          if-no-files-found: ignore
