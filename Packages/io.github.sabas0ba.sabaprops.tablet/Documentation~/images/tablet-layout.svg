<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Helvetica, Arial, sans-serif">
  <title>SabaProps Tablet: front view of the default theme</title>
  <!-- Drawn at 2 px per mm from the default TabletTheme: body 300 x 210 mm, bezel 11 mm,
       header 30 mm, spacing 6 mm, 4 x 3 buttons of 62 x 44.7 mm. -->
  <rect x="0" y="0" width="900" height="560" fill="#f4f5f7"/>

  <!-- handle -->
  <rect x="240" y="20" width="220" height="32" rx="16" fill="#292c31"/>
  <!-- body -->
  <rect x="50" y="60" width="600" height="420" rx="32" fill="#292c31"/>
  <!-- screen -->
  <rect x="72" y="82" width="556" height="376" rx="10" fill="#0d0f14"/>

  <!-- header -->
  <text x="84" y="119" font-size="20" fill="#ebf2ff">World</text>
  <text x="269" y="119" font-size="16" fill="#ebf2ff" text-anchor="middle">2 / 4</text>
  <rect x="333" y="88" width="86" height="48" rx="12" fill="#242933"/>
  <text x="376" y="118" font-size="16" fill="#ebf2ff" text-anchor="middle">Prev</text>
  <rect x="431" y="88" width="86" height="48" rx="12" fill="#242933"/>
  <text x="474" y="118" font-size="16" fill="#ebf2ff" text-anchor="middle">Next</text>
  <rect x="530" y="88" width="86" height="48" rx="12" fill="#242933"/>
  <text x="573" y="118" font-size="16" fill="#ebf2ff" text-anchor="middle">Close</text>

  <!-- button grid, row 1 -->
  <rect x="84" y="154" width="124" height="89" rx="12" fill="#3385c7"/>
  <text x="146" y="204" font-size="17" fill="#ebf2ff" text-anchor="middle">Mirror HQ</text>
  <rect x="220" y="154" width="124" height="89" rx="12" fill="#38404d"/>
  <text x="282" y="204" font-size="17" fill="#ebf2ff" text-anchor="middle">Mirror LQ</text>
  <rect x="356" y="154" width="124" height="89" rx="12" fill="#3385c7"/>
  <text x="418" y="204" font-size="17" fill="#ebf2ff" text-anchor="middle">Barrier</text>
  <rect x="492" y="154" width="124" height="89" rx="12" fill="#38404d"/>
  <text x="554" y="204" font-size="17" fill="#ebf2ff" text-anchor="middle">Heavy Effect</text>
  <!-- row 2 -->
  <rect x="84" y="255" width="124" height="89" rx="12" fill="#3385c7"/>
  <text x="146" y="305" font-size="17" fill="#ebf2ff" text-anchor="middle">Lamp</text>
  <rect x="220" y="255" width="124" height="89" rx="12" fill="#38404d"/>
  <text x="282" y="305" font-size="17" fill="#ebf2ff" text-anchor="middle">Post FX</text>
  <rect x="356" y="255" width="124" height="89" rx="12" fill="#6ba8e0"/>
  <text x="418" y="305" font-size="17" fill="#ebf2ff" text-anchor="middle">Video</text>
  <rect x="492" y="255" width="124" height="89" rx="12" fill="#38404d"/>
  <text x="554" y="305" font-size="17" fill="#ebf2ff" text-anchor="middle">Stage Cam</text>
  <!-- row 3, empty cells -->
  <rect x="84" y="357" width="124" height="89" rx="12" fill="none" stroke="#2a2f38" stroke-dasharray="6 5"/>
  <rect x="220" y="357" width="124" height="89" rx="12" fill="none" stroke="#2a2f38" stroke-dasharray="6 5"/>
  <rect x="356" y="357" width="124" height="89" rx="12" fill="none" stroke="#2a2f38" stroke-dasharray="6 5"/>
  <rect x="492" y="357" width="124" height="89" rx="12" fill="none" stroke="#2a2f38" stroke-dasharray="6 5"/>

  <!-- dimensions -->
  <line x1="50" y1="505" x2="650" y2="505" stroke="#555" stroke-width="1.5"/>
  <line x1="50" y1="498" x2="50" y2="512" stroke="#555" stroke-width="1.5"/>
  <line x1="650" y1="498" x2="650" y2="512" stroke="#555" stroke-width="1.5"/>
  <text x="350" y="530" font-size="16" fill="#333" text-anchor="middle">300 mm</text>
  <line x1="668" y1="60" x2="668" y2="480" stroke="#555" stroke-width="1.5"/>
  <line x1="661" y1="60" x2="675" y2="60" stroke="#555" stroke-width="1.5"/>
  <line x1="661" y1="480" x2="675" y2="480" stroke="#555" stroke-width="1.5"/>
  <text transform="translate(686 270) rotate(90)" font-size="16" fill="#333" text-anchor="middle">210 mm</text>

  <!-- legend -->
  <text x="730" y="96" font-size="17" fill="#222" font-weight="bold">Legend</text>
  <rect x="730" y="112" width="26" height="20" rx="5" fill="#38404d"/>
  <text x="766" y="127" font-size="15" fill="#222">OFF</text>
  <rect x="730" y="142" width="26" height="20" rx="5" fill="#3385c7"/>
  <text x="766" y="157" font-size="15" fill="#222">ON</text>
  <rect x="730" y="172" width="26" height="20" rx="5" fill="#6ba8e0"/>
  <text x="766" y="187" font-size="15" fill="#222">Pressed</text>
  <rect x="730" y="202" width="26" height="20" rx="5" fill="#242933"/>
  <text x="766" y="217" font-size="15" fill="#222">Header button</text>
  <rect x="730" y="232" width="26" height="20" rx="5" fill="#292c31"/>
  <text x="766" y="247" font-size="15" fill="#222">Handle / body</text>
  <text x="730" y="300" font-size="14" fill="#444">Buttons are raised caps.</text>
  <text x="730" y="320" font-size="14" fill="#444">VR: push with a fingertip.</text>
  <text x="730" y="340" font-size="14" fill="#444">Desktop: Interact.</text>
  <text x="730" y="370" font-size="14" fill="#444">Grab the handle to move it.</text>
</svg>
