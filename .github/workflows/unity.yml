name: Unity

# Compiles the package inside a real Unity Editor and runs EditMode tests.
# This is what closes the two gaps the offline `Verify` workflow cannot reach:
# UnityEditor API signatures, and whether Unity's surface shader generator
# actually accepts SabaProps/Foliage.
#
# Requires a Unity licence in repository secrets. Without one every step after
# the gate is skipped and the job reports success, so forks and contributors
# without access are not blocked.
#
#   UNITY_EMAIL     Unity ID email
#   UNITY_PASSWORD  Unity ID password
#   UNITY_LICENSE   contents of Unity_v20XX.ulf  (Personal licence)
#   UNITY_SERIAL    serial instead of UNITY_LICENSE  (Plus / Pro)
#
# See https://game.ci/docs/github/activation for how to obtain the .ulf file.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: Compile and EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check for a Unity licence
        id: licence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -euo pipefail
          if [ -n "${UNITY_LICENSE:-}" ] || [ -n "${UNITY_SERIAL:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unity job skipped::UNITY_LICENSE / UNITY_SERIAL is not set, so the real Unity compile was skipped. See .github/workflows/unity.yml."
          fi

      # The GameCI editor image is large; the default runner does not have room
      # for it alongside the preinstalled toolchains.
      - name: Free disk space
        if: steps.licence.outputs.available == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Assemble the CI project
        if: steps.licence.outputs.available == 'true'
        run: |
          set -euo pipefail
          cp -r .github/verify/CIProject CIProject
          # An embedded package under Packages/ is picked up without a manifest
          # entry, and resolves against the working tree rather than a release.
          cp -r Packages/com.sabaprops.foliage CIProject/Packages/com.sabaprops.foliage
          find CIProject -maxdepth 3 -not -path '*/.*' | sort

      - name: Cache Unity Library
        if: steps.licence.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: CIProject/Library
          key: unity-library-${{ hashFiles('Packages/com.sabaprops.foliage/**', '.github/verify/CIProject/**') }}
          restore-keys: |
            unity-library-

      - name: Run EditMode tests
        if: steps.licence.outputs.available == 'true'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: CIProject
          testMode: EditMode
          artifactsPath: CIProject/TestResults
          checkName: Unity EditMode results

      - name: Upload test results
        if: always() && steps.licence.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: CIProject/TestResults
          if-no-files-found: ignore
